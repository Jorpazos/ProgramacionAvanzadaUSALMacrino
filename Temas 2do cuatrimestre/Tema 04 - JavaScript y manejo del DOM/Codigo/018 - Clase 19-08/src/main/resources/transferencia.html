<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Banco USAL - Nueva Transferencia</title>
</head>
<body>

    <div class="container">
        <h1 class="mb-3 text-center">Formulario de transferencia bancaria</h1>

        <form id="formTransferencia">
            <div class="mb-3">
                <label class="form-label" for="cbuDestino">CBU Destino: </label>
                <input type="text"
                       id="cbuDestino"
                        class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Monto a transferir: </label>
                <input type="number"
                       class="form-control"
                       id="monto"
                       step="0.01"
                       placeholder="0.00">
            </div>

            <div class="mb-3">
                <label class="form-label">Motivo :</label>
                <select id="motivo" class="form-select">
                    <option value="-">Seleccione Motivo</option>
                    <option value="alquiler">Alquiler</option>
                    <option value="expensas">Expensas</option>
                    <option value="varios">Varios</option>
                </select>
            </div>

            <button type="submit"
                    class="btn btn-primary">Realizar Transferencia</button>
        </form>

        <div id="msjErrores"></div>
    </div>

    <script src="transferencia-logica.js"></script>
</body>
</html>
