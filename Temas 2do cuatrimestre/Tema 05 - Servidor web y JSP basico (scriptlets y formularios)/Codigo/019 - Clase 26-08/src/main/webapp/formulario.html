<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Introduccion JSP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <h2>Pagina 1 : Formualario HTML</h2>

    <div class="container">
        <form method="post"
              action="procesar-form.jsp">
            <div class="mb-3">
                <label class="form-label"
                        for="inNombre">Ingrese su nombre :</label>
                <input class="form-control"
                        id="inNombre"
                        name="txtNombre">
            </div>

            <div class="mb-3">
                <label class="form-label"
                        for="inEdad">Ingrese su edad :</label>
                <input class="form-control"
                        id="inEdad"
                        type="number"
                        name="txtEdad">

            </div>

            <button type="submit" class="btn btn-primary">Enviar a procesar</button>
        </form>
    </div>

</body>
</html>
